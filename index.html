<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Audios - Inglés</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        /* Contenedor para alinear botones en una sola línea */
        .button-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
        }
        .button-row button {
            margin: 0;
            flex: 1;
        }

        /* Parrilla de 5 botones por línea para la Pantalla 1 */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .episodes-grid button {
            width: 100%;
            margin: 0;
        }

        .text-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            white-space: pre-line;
            font-size: 14px;
        }
        .phrase-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
        }
        .phrase-card p {
            margin: 5px 0;
        }
        .phrase-en {
            font-weight: bold;
            color: #333;
        }
        .phrase-es {
            color: #666;
            font-size: 14px;
        }
        .btn-play-phrase {
            background-color: #28a745;
            padding: 5px 10px;
            font-size: 13px;
            width: auto;
            margin-top: 5px;
        }
        .btn-play-phrase:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Elemento de Audio oculto -->
    <audio id="audio-player"></audio>

    <!-- PANTALLA 1: Lista de Episodios (Generada en parrilla de 5) -->
    <div id="screen-1" class="screen active">
        <h2>Selecciona un Episodio</h2>
        <div id="episodes-container" class="episodes-grid">
            <!-- Los botones se generan solos aquí -->
        </div>
    </div>

    <!-- PANTALLA 2: Reproductor y Textos -->
    <div id="screen-2" class="screen">
        <h2 id="episode-title">Episodio</h2>

        <div class="button-row">
            <button onclick="playFullEpisode()">Reproducir</button>
            <button onclick="pauseAudio()">Parar</button>
            <button onclick="resumeAudio()">Reanudar</button>
        </div>
        
        <div class="button-row">
            <button onclick="showEnglish()">Texto EN</button>
            <button onclick="hideEnglish()" class="btn-secondary">Ocultar EN</button>
        </div>
        <div id="text-english" class="text-box"></div>

        <div class="button-row">
            <button onclick="showSpanish()">Texto ES</button>
            <button onclick="hideSpanish()" class="btn-secondary">Ocultar ES</button>
        </div>
        <div id="text-spanish" class="text-box"></div>

        <button onclick="goToStudy()" style="background-color: #28a745; margin-top: 15px;">Estudiar Frases</button>
        <button onclick="goToScreen1()" class="btn-secondary">Volver</button>
    </div>

    <!-- PANTALLA 3: Estudiar Frases -->
    <div id="screen-3" class="screen">
        <h2>Estudiar Frases</h2>
        <div id="phrases-container" style="max-height: 350px; overflow-y: auto; text-align: left; margin-bottom: 15px;"></div>
        <button onclick="goToScreen2()" class="btn-secondary">Volver</button>
    </div>

</div>

<script>
    // =========================================================================
    // ESTRUCTURA DE EPISODIOS CON AUDIOS TROCEADOS INDIVIDUALES (.m4a)
    // =========================================================================
    const misEpisodiosRellenos = {
        "64": [
            { en: "Excuse me. Quick question: what's the best way to get out of the airport?", es: "Disculpe. Una pregunta rápida: ¿cuál es la mejor manera de salir del aeropuerto?" },
            { en: "Hi! Sure, we have two main transportation options for you.", es: "¡Hola! Claro, tenemos dos opciones principales de transporte para usted." },
            { en: "Great! What’s the first option?", es: "¡Genial! ¿Cuál es la primera opción?" },
            { en: "The first option is taking a rideshare like Uber from the airport.", es: "La primera opción es tomar un servicio de transporte compartido como Uber desde el aeropuerto." },
            { en: "Where is the pick-up area for rideshares?", es: "¿Dónde está la zona de recogida para los vehículos compartidos?" },
            { en: "Just head outside toward Pillar 3 in the designated rideshare zone.", es: "Solo diríjase hacia afuera, hacia el Pilar 3, en la zona designada para vehículos compartidos." },
            { en: "That sounds easy. And what’s the second option?", es: "Suena fácil. ¿Y cuál es la segunda opción?" },
            { en: "You can take the free airport shuttle to the nearby bus station.", es: "Puede tomar el autobús lanzadera gratuito del aeropuerto hacia la estación de autobuses cercana." },
            { en: "Oh, a shuttle! Where does it drop passengers off?", es: "¡Oh, un servicio de autobús lanzadera! ¿Dónde deja a los pasajeros?" },
            { en: "It drops you off at the main bus terminal, right outside the airport.", es: "Los deja en la terminal principal de autobuses, justo afuera del aeropuerto." },
            { en: "So the shuttle is completely free of charge?", es: "¿Así que el autobús lanzadera es completamente gratuito?" },
            { en: "Yes, the airport shuttle is free, but you will need a ticket for the city bus.", es: "Sí, el autobús lanzadera del aeropuerto es gratuito, pero necesitará un boleto para el autobús urbano." },
            { en: "Which option is faster to get downtown?", es: "¿Cuál opción es más rápida para llegar al centro?" },
            { en: "Rideshares are faster, but the city bus is much more budget-friendly.", es: "Los vehículos compartidos son más rápidos, pero el autobús urbano es mucho más económico." },
            { en: "Where do I board the free shuttle?", es: "¿Dónde abordo el autobús lanzadera gratuito?" },
            { en: "Right outside Exit 2. You’ll see yellow signs that say Airport Shuttle.", es: "Justo afuera de la Salida 2. Verá letreros amarillos que dicen \"Airport Shuttle\"." },
            { en: "Perfect. I’ll take the shuttle to the bus station. Thank you!", es: "¡Perfecto! Tomaré el autobús lanzadera hacia la estación de autobuses. ¡Gracias!" },
            { en: "You're very welcome! Have a safe trip!", es: "¡De nada! ¡Que tenga un viaje seguro!" }
        ],

        "65": [
            { en: "Good morning. Welcome to First National Bank. How can I help you today?", es: "Buenos días. Bienvenido al First National Bank. ¿Cómo puedo ayudarle hoy?" },
            { en: "Good morning. I'd like to open a checking account for the first time, please.", es: "Buenos días. Me gustaría abrir una cuenta corriente por primera vez, por favor." },
            { en: "Great! I'd be happy to assist you with that. Do you have your ID with you?", es: "¡Genial! Estaré encantado de ayudarle con eso. ¿Tiene su documento de identidad consigo?" },
            { en: "Yes, I brought my driver's license and my social security card.", es: "Sí, traje mi licencia de conducir y mi tarjeta de seguridad social." },
            { en: "Perfect. We'll also need a proof of address, like a utility bill.", es: "Perfecto. También necesitaremos un comprobante de domicilio, como una factura de servicios públicos." },
            { en: "Here is an electric bill, but it's not under my name. Is this acceptable?", es: "Aquí tengo una factura de luz, pero no está a mi nombre. ¿Es aceptable?" },
            { en: "That works. Is this account for personal use or direct deposit from work?", es: "Eso sirve. ¿Esta cuenta es para uso personal o para depósito directo del trabajo?" },
            { en: "Mostly for direct deposit and paying my monthly bills online.", es: "Principalmente para depósito directo y para pagar mis facturas mensuales en línea." },
            { en: "Excellent. Our standard checking account has no monthly fee with direct deposit.", es: "Excelente. nuestra cuenta corriente estándar no tiene comisión mensual con el depósito directo." },
            { en: "That sounds good. Is there a minimum opening deposit required today?", es: "Suena bien. ¿Hay algún depósito mínimo de apertura requerido hoy?" },
            { en: "Yes, a $25 minimum deposit is required to activate the account.", es: "Sí, se requiere un depósito mínimo de 25 dólares para activar la cuenta." },
            { en: "Perfect. I have $50 in cash right here.", es: "Perfecto. Tengo 50 dólares en efectivo aquí mismo." },
            { en: "Awesome. I'll print out the agreement for you to sign.", es: "Increíble. Imprimiré el acuerdo para que lo firme." },
            { en: "Will I get a debit card today or will it arrive in the mail?", es: "¿Recibiré una tarjeta de débito hoy o llegará por correo?" },
            { en: "I can print a temporary debit card for you today, and the official one arrives next week.", es: "Puedo imprimirle una tarjeta de débito temporal hoy, y la oficial llegará la próxima semana." },
            { en: "That's very convenient. Can you also help me set up online banking?", es: "Eso es muy conveniente. ¿Puede ayudarme también a configurar la banca en línea?" },
            { en: "Absolutely. Once we finish this paperwork, we'll download the app together.", es: "Por supuesto. Una vez que terminemos este papeleo, descargaremos la aplicación juntos." },
            { en: "Thank you so much for all your help. I really appreciate it.", es: "Muchas gracias por toda su ayuda. Lo aprecio mucho." }
        ],

        "66": [
            { en: "Hey, Javier. What's up?", es: "Hola, Javier. ¿Qué tal?" },
            { en: "Good morning, Tom. I'm calling to let you know I'm running late.", es: "Buenos días, Tom. Te llamo para avisarte de que voy tarde." },
            { en: "Oh, gotcha. What happened? Is everything okay?", es: "Ah, entiendo. ¿Qué ha pasado? ¿Está todo bien?" },
            { en: "Yeah, everything's fine, but there was a major accident on the freeway.", es: "Sí, todo bien, pero ha habido un accidente grave en la autopista." },
            { en: "Oh, I see. Traffic must be completely backed up then.", es: "Ah, ya veo. El tráfico debe estar completamente colapsado entonces." },
            { en: "Exactly. The GPS says I'm stuck here for at least 45 minutes.", es: "Exacto. El GPS dice que estoy atrapado aquí durante al menos 45 minutos." },
            { en: "That's frustrating. What's your estimated time of arrival at the job site?", es: "Qué fastidio. ¿Cuál es tu hora estimada de llegada al lugar de trabajo?" },
            { en: "I should be at the warehouse by 7:35.", es: "Debería estar en el almacén a las 7:35." },
            { en: "Okay. Did you let someone on your crew know?", es: "De acuerdo. ¿Le has avisado a alguien de tu cuadrilla?" },
            { en: "Yes, I texted Carlos so he can start unloading the truck.", es: "Sí, le mandé un mensaje a Carlos para que pueda empezar a descargar el camión." },
            { en: "Good thinking. I'll make sure he gets started right away.", es: "Bien pensado. Me aseguraré de que empiece enseguida." },
            { en: "Thanks, Tom. I'll clock in as soon as I park and jump right into work.", es: "Gracias, Tom. Ficharé en cuanto aparque y me pondré a trabajar directamente." },
            { en: "Perfect. Just stay safe and focus on the road. Don't rush.", es: "Perfecto. Ten cuidado, céntrate en la carretera y no corras." },
            { en: "I appreciate that. I can stay an extra half hour today to catch up.", es: "Te lo agradezco. Puedo quedarme media hora extra hoy para ponerme al día." },
            { en: "That would be a huge help. Thanks, Javier.", es: "Eso sería de gran ayuda. Gracias, Javier." },
            { en: "No problem. Traffic is slowly starting to move, so I am on my way.", es: "De nada. El tráfico está empezando a moverse despacio, así que ya voy de camino." },
            { en: "Sounds good. Drive safe and see you in a bit.", es: "Me parece bien. Conduce con cuidado y nos vemos en un rato." },
            { en: "Will do. See you soon, Tom.", es: "Así lo haré. Nos vemos pronto, Tom." }
        ]
    };

    const availableEpisodes = [];
    let currentEpisodeId = null;
    let currentPhraseIndex = 0;
    let isPlayingSequence = false;

    // Genera automáticamente los 75 contenedores
    for (let i = 1; i <= 75; i++) {
        let idFormatted = i < 10 ? "0" + i : "" + i;
        let frasesDelEpisodio = misEpisodiosRellenos[idFormatted] || [];

        availableEpisodes.push({
            id: idFormatted,
            title: `Episodio ${idFormatted}`,
            phrases: frasesDelEpisodio
        });
    }

    // Dibujar botones en Pantalla 1
    window.onload = function() {
        const episodesContainer = document.getElementById('episodes-container');
        episodesContainer.innerHTML = "";

        availableEpisodes.forEach(ep => {
            if (ep.phrases && ep.phrases.length > 0) {
                const btn = document.createElement('button');
                btn.innerText = ep.id;
                btn.onclick = () => openEpisode(ep.id);
                episodesContainer.appendChild(btn);
            }
        });

        // Configurar listener para reproducir las frases en secuencia
        const audio = getAudio();
        audio.onended = function() {
            if (isPlayingSequence) {
                currentPhraseIndex++;
                const ep = availableEpisodes.find(item => item.id === currentEpisodeId);
                if (ep && currentPhraseIndex < ep.phrases.length) {
                    playPhraseByIndex(currentPhraseIndex);
                } else {
                    isPlayingSequence = false;
                }
            }
        };
    };

    function openEpisode(id) {
        currentEpisodeId = id;
        pauseAudio();

        const ep = availableEpisodes.find(item => item.id === id);
        if(ep) {
            document.getElementById('episode-title').innerText = `Episodio ${ep.id}`;
            
            let enText = "";
            let esText = "";
            ep.phrases.forEach(p => {
                enText += p.en + "\n";
                esText += p.es + "\n";
            });
            document.getElementById('text-english').innerText = enText.trim();
            document.getElementById('text-spanish').innerText = esText.trim();

            const phrasesContainer = document.getElementById('phrases-container');
            phrasesContainer.innerHTML = "";
            ep.phrases.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <p class="phrase-en">${index + 1}. ${p.en}</p>
                    <p class="phrase-es">${p.es}</p>
                    <button class="btn-play-phrase" onclick="playSpecificPhrase(${index})">Escuchar frase</button>
                `;
                phrasesContainer.appendChild(card);
            });
        }
        switchScreen('screen-2');
    }

    // Auxiliar para formatear el número de archivo con 2 dígitos (ej: 1 -> "01")
    function formatIndex(index) {
        let num = index + 1;
        return num < 10 ? "0" + num : "" + num;
    }

    // Reproducir una frase concreta por su índice
    function playSpecificPhrase(index) {
        isPlayingSequence = false;
        playPhraseByIndex(index);
    }

    function playPhraseByIndex(index) {
        currentPhraseIndex = index;
        const fileNumber = formatIndex(index);
        const audio = getAudio();
        // Carga el archivo individual desde la carpeta audios/ (ej: audios/66_01.m4a)
        audio.src = `audios/${currentEpisodeId}_${fileNumber}.m4a`;
        audio.play();
    }

    // Reproducir todo el episodio frase por frase en secuencia
    function playFullEpisode() {
        isPlayingSequence = true;
        playPhraseByIndex(0);
    }

    function goToScreen1() {
        pauseAudio();
        switchScreen('screen-1');
    }

    function goToScreen2() {
        pauseAudio();
        switchScreen('screen-2');
    }

    function goToStudy() {
        pauseAudio();
        switchScreen('screen-3');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function getAudio() {
        return document.getElementById('audio-player');
    }

    function pauseAudio() {
        isPlayingSequence = false;
        getAudio().pause();
    }

    function resumeAudio() {
        getAudio().play();
    }

    function showEnglish() { document.getElementById('text-english').style.display = 'block'; }
    function hideEnglish() { document.getElementById('text-english').style.display = 'none'; }
    function showSpanish() { document.getElementById('text-spanish').style.display = 'block'; }
    function hideSpanish() { document.getElementById('text-spanish').style.display = 'none'; }
</script>

</body>
</html>
