<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Audios - Inglés</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        /* Contenedor para alinear botones en una sola línea */
        .button-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
        }
        .button-row button {
            margin: 0;
            flex: 1;
        }

        /* Parrilla de 5 botones por línea para la Pantalla 1 */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .episodes-grid button {
            width: 100%;
            margin: 0;
        }

        .text-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            white-space: pre-line;
            font-size: 14px;
        }
        .phrase-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
        }
        .phrase-card p {
            margin: 5px 0;
        }
        .phrase-en {
            font-weight: bold;
            color: #333;
        }
        .phrase-es {
            color: #666;
            font-size: 14px;
        }
        .btn-play-phrase {
            background-color: #28a745;
            padding: 5px 10px;
            font-size: 13px;
            width: auto;
            margin-top: 5px;
        }
        .btn-play-phrase:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Elemento de Audio oculto -->
    <audio id="audio-player"></audio>

    <!-- PANTALLA 1: Lista de Episodios (Generada en parrilla de 5) -->
    <div id="screen-1" class="screen active">
        <h2>Selecciona un Episodio</h2>
        <div id="episodes-container" class="episodes-grid">
            <!-- Los botones se generan solos aquí -->
        </div>
    </div>

    <!-- PANTALLA 2: Reproductor y Textos -->
    <div id="screen-2" class="screen">
        <h2 id="episode-title">Episodio</h2>

        <div class="button-row">
            <button onclick="playAudio()">Reproducir</button>
            <button onclick="pauseAudio()">Parar</button>
            <button onclick="resumeAudio()">Reanudar</button>
        </div>
        
        <div class="button-row">
            <button onclick="showEnglish()">Texto EN</button>
            <button onclick="hideEnglish()" class="btn-secondary">Ocultar EN</button>
        </div>
        <div id="text-english" class="text-box"></div>

        <div class="button-row">
            <button onclick="showSpanish()">Texto ES</button>
            <button onclick="hideSpanish()" class="btn-secondary">Ocultar ES</button>
        </div>
        <div id="text-spanish" class="text-box"></div>

        <button onclick="goToStudy()" style="background-color: #28a745; margin-top: 15px;">Estudiar Frases</button>
        <button onclick="goToScreen1()" class="btn-secondary">Volver</button>
    </div>

    <!-- PANTALLA 3: Estudiar Frases -->
    <div id="screen-3" class="screen">
        <h2>Estudiar Frases</h2>
        <div id="phrases-container" style="max-height: 350px; overflow-y: auto; text-align: left; margin-bottom: 15px;"></div>
        <button onclick="goToScreen2()" class="btn-secondary">Volver</button>
    </div>

</div>

<script>
    // =========================================================================
    // AQUÍ PUEDES AÑADIR O EDITAR TUS EPISODIOS FÁCILMENTE
    // =========================================================================
    const misEpisodiosRellenos = {
        // Ejemplo para el episodio 15 (cuando lo tengas, solo descoméntalo o añádelo así):
        /*
        "15": [
            { start: 0.0, end: 3.5, en: "English phrase 1...", es: "Frase en español 1..." },
            { start: 3.6, end: 7.0, en: "English phrase 2...", es: "Frase en español 2..." }
        ],
        */

        // Tu episodio 64 actual
        "64": [
            { start: 2.5, end: 7.1, en: "Excuse me. Quick question: what's the best way to get out of the airport?", es: "Disculpe. Una pregunta rápida: ¿cuál es la mejor manera de salir del aeropuerto?" },
            { start: 7.2, end: 10.6, en: "Hi! Sure, we have two main transportation options for you.", es: "¡Hola! Claro, tenemos dos opciones principales de transporte para usted." },
            { start: 10.6, end: 13.0, en: "Great! What’s the first option?", es: "¡Genial! ¿Cuál es la primera opción?" },
            { start: 13.0, end: 16.8, en: "The first option is taking a rideshare like Uber from the airport.", es: "La primera opción es tomar un servicio de transporte compartido como Uber desde el aeropuerto." },
            { start: 16.8, end: 19.0, en: "Where is the pick-up area for rideshares?", es: "¿Dónde está la zona de recogida para los vehículos compartidos?" },
            { start: 19.0, end: 23.3, en: "Just head outside toward Pillar 3 in the designated rideshare zone.", es: "Solo diríjase hacia afuera, hacia el Pilar 3, en la zona designada para vehículos compartidos." },
            { start: 23.3, end: 26.3, en: "That sounds easy. And what’s the second option?", es: "Suena fácil. ¿Y cuál es la segunda opción?" },
            { start: 26.3, end: 29.8, en: "You can take the free airport shuttle to the nearby bus station.", es: "Puede tomar el autobús lanzadera gratuito del aeropuerto hacia la estación de autobuses cercana." },
            { start: 29.8, end: 32.9, en: "Oh, a shuttle! Where does it drop passengers off?", es: "¡Oh, un servicio de autobús lanzadera! ¿Dónde deja a los pasajeros?" },
            { start: 32.9, end: 36.5, en: "It drops you off at the main bus terminal, right outside the airport.", es: "Los deja en la terminal principal de autobuses, justo afuera del aeropuerto." },
            { start: 36.5, end: 39.1, en: "So the shuttle is completely free of charge?", es: "¿Así que el autobús lanzadera es completamente gratuito?" },
            { start: 39.1, end: 43.6, en: "Yes, the airport shuttle is free, but you will need a ticket for the city bus.", es: "Sí, el autobús lanzadera del aeropuerto es gratuito, pero necesitará un boleto para el autobús urbano." },
            { start: 43.6, end: 46.5, en: "Which option is faster to get downtown?", es: "¿Cuál opción es más rápida para llegar al centro?" },
            { start: 46.5, end: 50.8, en: "Rideshares are faster, but the city bus is much more budget-friendly.", es: "Los vehículos compartidos son más rápidos, pero el autobús urbano es mucho más económico." },
            { start: 50.8, end: 52.8, en: "Where do I board the free shuttle?", es: "¿Dónde abordo el autobús lanzadera gratuito?" },
            { start: 52.8, end: 57.0, en: "Right outside Exit 2. You’ll see yellow signs that say Airport Shuttle.", es: "Justo afuera de la Salida 2. Verá letreros amarillos que dicen \"Airport Shuttle\"." },
            { start: 57.0, end: 60.7, en: "Perfect. I’ll take the shuttle to the bus station. Thank you!", es: "¡Perfecto! Tomaré el autobús lanzadera hacia la estación de autobuses. ¡Gracias!" },
            { start: 60.7, end: 64.5, en: "You're very welcome! Have a safe trip!", es: "¡De nada! ¡Que tenga un viaje seguro!" }
        ],

        "65": [
            { start: 0.0, end: 4.1, en: "Good morning. Welcome to First National Bank. How can I help you today?", es: "Buenos días. Bienvenido al First National Bank. ¿Cómo puedo ayudarle hoy?" },
            { start: 4.1, end: 8.5, en: "Good morning. I'd like to open a checking account for the first time, please.", es: "Buenos días. Me gustaría abrir una cuenta corriente por primera vez, por favor." },
            { start: 8.5, end: 13.0, en: "Great! I'd be happy to assist you with that. Do you have your ID with you?", es: "¡Genial! Estaré encantado de ayudarle con eso. ¿Tiene su documento de identidad consigo?" },
            { start: 13.0, end: 17.5, en: "Yes, I brought my driver's license and my social security card.", es: "Sí, traje mi licencia de conducir y mi tarjeta de seguridad social." },
            { start: 17.5, end: 21.8, en: "Perfect. We'll also need a proof of address, like a utility bill.", es: "Perfecto. También necesitaremos un comprobante de domicilio, como una factura de servicios públicos." },
            { start: 21.8, end: 27.2, en: "Here is an electric bill, but it's not under my name. Is this acceptable?", es: "Aquí tengo una factura de luz, pero no está a mi nombre. ¿Es aceptable?" },
            { start: 27.2, end: 32.7, en: "That works. Is this account for personal use or direct deposit from work?", es: "Eso sirve. ¿Esta cuenta es para uso personal o para depósito directo del trabajo?" },
            { start: 32.7, end: 37.3, en: "Mostly for direct deposit and paying my monthly bills online.", es: "Principalmente para depósito directo y para pagar mis facturas mensuales en línea." },
            { start: 37.3, end: 43.1, en: "Excellent. Our standard checking account has no monthly fee with direct deposit.", es: "Excelente. nuestra cuenta corriente estándar no tiene comisión mensual con el depósito directo." },
            { start: 43.1, end: 47.7, en: "That sounds good. Is there a minimum opening deposit required today?", es: "Suena bien. ¿Hay algún depósito mínimo de apertura requerido hoy?" },
            { start: 47.7, end: 53.0, en: "Yes, a $25 minimum deposit is required to activate the account.", es: "Sí, se requiere un depósito mínimo de 25 dólares para activar la cuenta." },
            { start: 53.0, end: 56.4, en: "Perfect. I have $50 in cash right here.", es: "Perfecto. Tengo 50 dólares en efectivo aquí mismo." },
            { start: 56.4, end: 60.1, en: "Awesome. I'll print out the agreement for you to sign.", es: "Increíble. Imprimiré el acuerdo para que lo firme." },
            { start: 60.1, end: 64.3, en: "Will I get a debit card today or will it arrive in the mail?", es: "¿Recibiré una tarjeta de débito hoy o llegará por correo?" },
            { start: 64.3, end: 71.0, en: "I can print a temporary debit card for you today, and the official one arrives next week.", es: "Puedo imprimirle una tarjeta de débito temporal hoy, y la oficial llegará la próxima semana." },
            { start: 71.0, end: 75.8, en: "That's very convenient. Can you also help me set up online banking?", es: "Eso es muy conveniente. ¿Puede ayudarme también a configurar la banca en línea?" },
            { start: 75.8, end: 81.2, en: "Absolutely. Once we finish this paperwork, we'll download the app together.", es: "Por supuesto. Una vez que terminemos este papeleo, descargaremos la aplicación juntos." },
            { start: 81.2, end: 85.0, en: "Thank you so much for all your help. I really appreciate it.", es: "Muchas gracias por toda su ayuda. Lo aprecio mucho." }
        ]


        
    };
    // =========================================================================

    const availableEpisodes = [];

    // Genera automáticamente los 75 contenedores (del "01" al "75")
    for (let i = 1; i <= 75; i++) {
        let idFormatted = i < 10 ? "0" + i : "" + i;
        
        // Verifica si existen frases para este episodio en el objeto de arriba
        let frasesDelEpisodio = misEpisodiosRellenos[idFormatted] || [];

        availableEpisodes.push({
            id: idFormatted,
            title: `Episodio ${idFormatted}`,
            phrases: frasesDelEpisodio
        });
    }

    // Dibuja en la Pantalla 1 únicamente los botones que tienen frases
    window.onload = function() {
        const episodesContainer = document.getElementById('episodes-container');
        episodesContainer.innerHTML = "";

        availableEpisodes.forEach(ep => {
            if (ep.phrases && ep.phrases.length > 0) {
                const btn = document.createElement('button');
                btn.innerText = ep.id;
                btn.onclick = () => openEpisode(ep.id);
                episodesContainer.appendChild(btn);
            }
        });
    };

    let stopTimeTimeout = null;

    function openEpisode(id) {
        const ep = availableEpisodes.find(item => item.id === id);
        if(ep) {
            document.getElementById('episode-title').innerText = `Episodio ${ep.id}`;
            
            let enText = "";
            let esText = "";
            ep.phrases.forEach(p => {
                enText += p.en + "\n";
                esText += p.es + "\n";
            });
            document.getElementById('text-english').innerText = enText.trim();
            document.getElementById('text-spanish').innerText = esText.trim();

            const phrasesContainer = document.getElementById('phrases-container');
            phrasesContainer.innerHTML = "";
            ep.phrases.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <p class="phrase-en">${index + 1}. ${p.en}</p>
                    <p class="phrase-es">${p.es}</p>
                    <button class="btn-play-phrase" onclick="playSpecificPhrase(${p.start}, ${p.end})">Escuchar frase</button>
                `;
                phrasesContainer.appendChild(card);
            });
            
            document.getElementById('audio-player').src = `audios/${ep.id}.mp3`;
        }
        switchScreen('screen-2');
    }

    function playSpecificPhrase(startTime, endTime) {
        const audio = document.getElementById('audio-player');
        if (stopTimeTimeout) clearTimeout(stopTimeTimeout);

        audio.currentTime = startTime;
        audio.play();

        const durationMs = (endTime - startTime) * 1000;
        stopTimeTimeout = setTimeout(() => {
            audio.pause();
        }, durationMs);
    }

    function goToScreen1() {
        pauseAudio();
        switchScreen('screen-1');
    }

    function goToScreen2() {
        pauseAudio();
        switchScreen('screen-2');
    }

    function goToStudy() {
        pauseAudio();
        switchScreen('screen-3');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function getAudio() {
        return document.getElementById('audio-player');
    }

    function playAudio() {
        if (stopTimeTimeout) clearTimeout(stopTimeTimeout);
        getAudio().play();
    }

    function pauseAudio() {
        if (stopTimeTimeout) clearTimeout(stopTimeTimeout);
        getAudio().pause();
    }

    function resumeAudio() {
        if (stopTimeTimeout) clearTimeout(stopTimeTimeout);
        getAudio().play();
    }

    function showEnglish() { document.getElementById('text-english').style.display = 'block'; }
    function hideEnglish() { document.getElementById('text-english').style.display = 'none'; }
    function showSpanish() { document.getElementById('text-spanish').style.display = 'block'; }
    function hideSpanish() { document.getElementById('text-spanish').style.display = 'none'; }
</script>

</body>
</html>
