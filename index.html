<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Audios - Inglés</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
        }
        .button-row button {
            margin: 0;
            flex: 1;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .episodes-grid button {
            width: 100%;
            margin: 0;
        }

        .text-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            white-space: pre-line;
            font-size: 14px;
        }
        .phrase-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
        }
        .phrase-card p {
            margin: 5px 0;
        }
        .phrase-en {
            font-weight: bold;
            color: #333;
        }
        .phrase-es {
            color: #666;
            font-size: 14px;
        }
        /* Estilos para la Pantalla 4 (Español destacado + Inglés secundario) */
        .phrase-es-bold {
            font-weight: bold;
            color: #222;
            font-size: 15px;
        }
        .phrase-en-normal {
            color: #555;
            font-size: 14px;
            margin-top: 4px;
        }
        .btn-play-phrase {
            background-color: #28a745;
            padding: 5px 10px;
            font-size: 13px;
            width: auto;
            margin-top: 5px;
        }
        .btn-play-phrase:hover {
            background-color: #218838;
        }
        #debug-info {
            background: #e2e3e5;
            border: 1px solid #d6d8db;
            color: #383d41;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            word-break: break-all;
            text-align: left;
        }
    </style>

     <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
</head>
<body>

<div class="container">


    <div id="screen-auth" class="screen active">
    <h2>Acceso a Rolando</h2>
    <p>Introduce tu correo electrónico para recibir el enlace de acceso.</p>

    <input
        type="email"
        id="auth-email"
        placeholder="Correo electrónico"
        autocomplete="email"
        required
        style="width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;font-size:16px;"
    >

    <button id="btnLoginLink" onclick="enviarEnlaceAcceso()">
        Enviar enlace de acceso
    </button>

    <p id="auth-mensaje" role="status" aria-live="polite"></p>
</div>

    <div id="audio-container"></div>

    <!-- PANTALLA 1 -->
    <div id="screen-1" class="screen">
        <h2>Selecciona un Episodio</h2>
        <div id="episodes-container" class="episodes-grid"></div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="screen-2" class="screen">
        <h2 id="episode-title">Episodio</h2>

        <div id="debug-info">Cargando datos...</div>

        <div class="button-row">
            <button onclick="playFullEpisodeMP3()">Reproducir MP3 Completo (EN)</button>
            <button onclick="pauseAudio()">Parar</button>
            <button onclick="resumeAudio()">Reanudar</button>
        </div>
        
        <div class="button-row">
            <button onclick="showEnglish()">Texto EN</button>
            <button onclick="hideEnglish()" class="btn-secondary">Ocultar EN</button>
        </div>
        <div id="text-english" class="text-box"></div>

        <div class="button-row">
            <button onclick="showSpanish()">Texto ES</button>
            <button onclick="hideSpanish()" class="btn-secondary">Ocultar ES</button>
        </div>
        <div id="text-spanish" class="text-box"></div>

        <button onclick="goToStudy()" style="background-color: #28a745; margin-top: 15px;">Estudiar Frases (Inglés .m4a)</button>
        <button onclick="goToStudySpanish()" style="background-color: #17a2b8; margin-top: 6px;">Estudiar Español (Audio y Lectura)</button>
        <button onclick="goToScreen1()" class="btn-secondary">Volver</button>
    </div>

    <!-- PANTALLA 3 -->
    <div id="screen-3" class="screen">
        <h2>Estudiar Frases (Inglés)</h2>
        <div id="phrases-container" style="max-height: 350px; overflow-y: auto; text-align: left; margin-bottom: 15px;"></div>
        <button onclick="goToScreen2()" class="btn-secondary">Volver</button>
    </div>

    <!-- PANTALLA 4: Estudiar Español -->
    <div id="screen-4" class="screen">
        <h2 id="episode-title-es">Estudiar Español</h2>

        <div class="button-row">
            <button onclick="playFullEpisodeSpanishMP3()" style="background-color: #ffc107; color: #000; font-weight: bold;">Reproducir MP3 Completo (ES)</button>
            <button onclick="pauseAudio()">Parar</button>
            <button onclick="resumeAudio()">Reanudar</button>
        </div>

        <div class="button-row" style="margin-top: 10px;">
            <button onclick="showSpanishStudyText()">Texto ES</button>
            <button onclick="hideSpanishStudyText()" class="btn-secondary">Ocultar ES</button>
        </div>
        <div id="text-spanish-study" class="text-box"></div>

        <div id="phrases-spanish-container" style="max-height: 300px; overflow-y: auto; text-align: left; margin-top: 15px; margin-bottom: 15px;"></div>
        
        <button onclick="goToScreen2()" class="btn-secondary">Volver</button>
    </div>

</div>

    const availableEpisodes = [];
    let currentEpisodeId = null;

    


// CARGA AUTOMÁTICA: Detecta cualquier episodio que metas en el objeto sin importar el número
    Object.keys(misEpisodiosRellenos).sort().forEach(idFormatted => {
        let frasesDelEpisodio = misEpisodiosRellenos[idFormatted] || [];
        availableEpisodes.push({
            id: idFormatted,
            title: `Episodio ${idFormatted}`,
            phrases: frasesDelEpisodio
        });
    });

    

    window.onload = function() {
        const episodesContainer = document.getElementById('episodes-container');
        episodesContainer.innerHTML = "";

        availableEpisodes.forEach(ep => {
            if (ep.phrases && ep.phrases.length > 0) {
                const btn = document.createElement('button');
                btn.innerText = ep.id;
                btn.onclick = () => openEpisode(ep.id);
                episodesContainer.appendChild(btn);
            }
        });
        
        crearReproductorNuevo();
    };

    function crearReproductorNuevo() {
        const container = document.getElementById('audio-container');
        container.innerHTML = '<audio id="audio-player"></audio>';
        
        const audio = document.getElementById('audio-player');

        audio.onerror = function() {
            const info = document.getElementById('debug-info');
            if (info && audio.src) {
                info.innerText = `❌ Error cargando audio: ${audio.src}`;
                info.style.background = '#f8d7da';
                info.style.color = '#721c24';
            }
        };
    }

    function openEpisode(id) {
        currentEpisodeId = id;
        pauseAudio();

        const ep = availableEpisodes.find(item => item.id === id);
        if(ep) {
            document.getElementById('episode-title').innerText = `Episodio ${ep.id}`;
            document.getElementById('episode-title-es').innerText = `Estudiar Español - Episodio ${ep.id}`;
            const info = document.getElementById('debug-info');
            info.innerText = `Episodio ${ep.id} preparado.`;
            info.style.background = '#e2e3e5';
            info.style.color = '#383d41';
            
            let enText = "";
            let esText = "";
            ep.phrases.forEach(p => {
                enText += p.en + "\n";
                esText += p.es + "\n";
            });
            document.getElementById('text-english').innerText = enText.trim();
            document.getElementById('text-spanish').innerText = esText.trim();
            document.getElementById('text-spanish-study').innerText = esText.trim();

            // Rellenar frases de la pantalla 3 (Estudiar Frases - Inglés)
            const phrasesContainer = document.getElementById('phrases-container');
            phrasesContainer.innerHTML = "";
            ep.phrases.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <p class="phrase-en">${index + 1}. ${p.en}</p>
                    <p class="phrase-es">${p.es}</p>
                    <button class="btn-play-phrase" onclick="playSpecificPhrase(${index})">Escuchar frase</button>
                `;
                phrasesContainer.appendChild(card);
            });

            // Rellenar frases de la pantalla 4 (Estudiar Español con audios reales)
            const phrasesSpanishContainer = document.getElementById('phrases-spanish-container');
            phrasesSpanishContainer.innerHTML = "";
            ep.phrases.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <p class="phrase-es-bold">${index + 1}. ${p.es}</p>
                    <p class="phrase-en-normal">${p.en}</p>
                    <button class="btn-play-phrase" onclick="playSpecificSpanishPhrase(${index})">Escuchar frase (ES)</button>
                `;
                phrasesSpanishContainer.appendChild(card);
            });
        }
        switchScreen('screen-2');
    }

    function formatIndex(index) {
        let num = index + 1;
        return num < 10 ? "0" + num : "" + num;
    }

    function playSpecificPhrase(index) {
        const fileNumber = formatIndex(index);
        crearReproductorNuevo();
        const audio = document.getElementById('audio-player');
        
        const rutaM4a = `${currentEpisodeId}/${currentEpisodeId}_${fileNumber}.m4a`;
        const info = document.getElementById('debug-info');
        info.innerText = `Reproduciendo frase (EN): ${rutaM4a}`;
        info.style.background = '#d4edda';
        info.style.color = '#155724';
        
        audio.src = rutaM4a;
        audio.play().catch(e => {
            info.innerText = `❌ Error: ${e.message}`;
            info.style.background = '#f8d7da';
            info.style.color = '#721c24';
        });
    }

    // Reproduce la frase individual en español desde la carpeta del episodio (ej: 68/68e_01.m4a)
    function playSpecificSpanishPhrase(index) {
        const fileNumber = formatIndex(index);
        crearReproductorNuevo();
        const audio = document.getElementById('audio-player');
        
        const rutaM4aES = `${currentEpisodeId}/${currentEpisodeId}e_${fileNumber}.m4a`;
        const info = document.getElementById('debug-info');
        info.innerText = `Reproduciendo frase (ES): ${rutaM4aES}`;
        info.style.background = '#d4edda';
        info.style.color = '#155724';
        
        audio.src = rutaM4aES;
        audio.play().catch(e => {
            info.innerText = `❌ Error: ${e.message}`;
            info.style.background = '#f8d7da';
            info.style.color = '#721c24';
        });
    }

    function playFullEpisodeMP3() {
        crearReproductorNuevo();
        const audio = document.getElementById('audio-player');
        
        const rutaMp3 = `audios/${currentEpisodeId}.mp3`;
        const info = document.getElementById('debug-info');
        info.innerText = `Reproduciendo MP3 completo (EN): ${rutaMp3}`;
        info.style.background = '#d4edda';
        info.style.color = '#155724';
        
        audio.src = rutaMp3;
        audio.play().catch(e => {
            info.innerText = `❌ Error MP3: ${e.message}`;
            info.style.background = '#f8d7da';
            info.style.color = '#721c24';
        });
    }

    // Reproduce el MP3 completo en español desde la carpeta audios (ej: audios/68e.mp3)
    function playFullEpisodeSpanishMP3() {
        crearReproductorNuevo();
        const audio = document.getElementById('audio-player');
        
        const rutaMp3ES = `audios/${currentEpisodeId}e.mp3`;
        const info = document.getElementById('debug-info');
        info.innerText = `Reproduciendo MP3 completo (ES): ${rutaMp3ES}`;
        info.style.background = '#d4edda';

            info.innerText = `❌ Error MP3 ES: ${e.message}`;
            info.style.background = '#f8d7da';
            info.style.color = '#721c24';
        });
    }

    function goToScreen1() {
        pauseAudio();
        switchScreen('screen-1');
    }

    function goToScreen2() {
        pauseAudio();
        switchScreen('screen-2');
    }

    function goToStudy() {
        pauseAudio();
        switchScreen('screen-3');
    }

    function goToStudySpanish() {
        pauseAudio();
        switchScreen('screen-4');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function pauseAudio() {
        const audio = document.getElementById('audio-player');
        if (audio) audio.pause();
    }

    function resumeAudio() {
        const audio = document.getElementById('audio-player');
        if (audio) audio.play();
    }

    function showEnglish() { document.getElementById('text-english').style.display = 'block'; }
    function hideEnglish() { document.getElementById('text-english').style.display = 'none'; }
    function showSpanish() { document.getElementById('text-spanish').style.display = 'block'; }
    function hideSpanish() { document.getElementById('text-spanish').style.display = 'none'; }

    function showSpanishStudyText() { document.getElementById('text-spanish-study').style.display = 'block'; }
    function hideSpanishStudyText() { document.getElementById('text-spanish-study').style.display = 'none'; }
</script>

    isSignInWithEmailLink,
    signInWithEmailLink,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCBHvcTekjagn5PSV_mJm2OqXk7IIb7lvU",
    authDomain: "personajes-5663b.firebaseapp.com",
    projectId: "personajes-5663b",

    messagingSenderId: "579683727517",
    appId: "1:579683727517:web:af1842ca41c81af4be3c74",
    measurementId: "G-ZYQ1B5CRVV"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const actionCodeSettings = {
    url: "https://juandagarre.github.io/Rolando/",
    handleCodeInApp: true
};

const emailStorageKey = "emailForSignInRolando";

emailjs.init("e_JkUHvKVQ4eBKEUs");

function mostrarPantalla(id) {
    document.querySelectorAll(".screen").forEach(pantalla => {
        pantalla.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

window.enviarEnlaceAcceso = async function () {
    const emailInput = document.getElementById("auth-email");
    const mensaje = document.getElementById("auth-mensaje");
    const boton = document.getElementById("btnLoginLink");

    const email = emailInput.value.trim();

    if (!email || !emailInput.checkValidity()) {
        mensaje.textContent = "Introduce un correo electrónico válido.";
        return;
    }

    boton.disabled = true;
    mensaje.textContent = "Enviando enlace de acceso…";

    try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);

        localStorage.setItem(emailStorageKey, email);

        mensaje.textContent =
            "Enlace enviado. Abre tu correo y pulsa el enlace para entrar en Rolando.";
    } catch (error) {
        console.error("Error al enviar el enlace:", error);

        mensaje.textContent =
            "No se pudo enviar el enlace. Comprueba la configuración de Firebase e inténtalo de nuevo.";
    } finally {
        boton.disabled = false;
    }
};

async function comprobarEnlaceAcceso() {
    if (!isSignInWithEmailLink(auth, window.location.href)) {
        return;
    }

    let email = localStorage.getItem(emailStorageKey);

    if (!email) {
        email = window.prompt(
            "Introduce el correo electrónico al que has recibido el enlace:"
        );
    }

    if (!email || !email.trim()) {
        document.getElementById("auth-mensaje").textContent =
            "Necesitas introducir el correo utilizado para solicitar el enlace.";
        return;
    }

    try {
        await signInWithEmailLink(
            auth,
            email.trim(),
            window.location.href
        );

        localStorage.removeItem(emailStorageKey);

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );
    } catch (error) {
        console.error("Error al validar el enlace:", error);

        document.getElementById("auth-mensaje").textContent =
            "No se pudo validar el enlace. Solicita uno nuevo e inténtalo otra vez.";
    }
}

async function enviarAvisoAcceso(user) {
    const claveAviso = "rolando_notificado_" + user.uid;

    if (localStorage.getItem(claveAviso)) {
        return;
    }

    try {
        await emailjs.send(
            "service_ft1wkhu",
            "template_4acbswy",
            {
                user_email: user.email || ""
            }
        );

        localStorage.setItem(claveAviso, "si");
        console.log("Aviso de acceso enviado.");
    } catch (error) {
        console.error("Error al enviar el aviso por EmailJS:", error);
    }
}

onAuthStateChanged(auth, async user => {
    if (user) {
        mostrarPantalla("screen-1");
        await enviarAvisoAcceso(user);
    } else {
        mostrarPantalla("screen-auth");
    }
});

comprobarEnlaceAcceso();
</script>
